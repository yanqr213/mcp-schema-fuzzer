name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate example fixtures
        run: python -m mcp_schema_fuzzer validate-fixtures examples/filesystem-tool/suite.json
      - name: Run fuzz smoke
        run: python -m mcp_schema_fuzzer fuzz examples/filesystem-tool/suite.json --output work/ci/filesystem --check error
