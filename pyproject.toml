[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-schema-fuzzer"
version = "0.3.0"
description = "Offline schema fuzzing for MCP servers and AI agent tools."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "OpenAI Codex"}
]
keywords = ["mcp", "schema", "fuzz", "json-schema", "agent-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities"
]

[project.scripts]
mcp-schema-fuzzer = "mcp_schema_fuzzer.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/mcp-schema-fuzzer"
Documentation = "https://github.com/yanqr213/mcp-schema-fuzzer#readme"
Issues = "https://github.com/yanqr213/mcp-schema-fuzzer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
